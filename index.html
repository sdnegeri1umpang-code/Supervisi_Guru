 return `<h2>Laporan Gabungan</h2><div class="card"><p>Menggabungkan hasil supervisi pembelajaran dan supervisi administrasi kelas dalam satu laporan.</p><label>Supervisi pembelajaran</label><select id="gp">${op('pembelajaran')}</select><label>Supervisi administrasi kelas (guru yang sama)</label><select id="ga">${op('administrasi')}</select><p><button class="b g" onclick="repG($('#gp').value,$('#ga').value)">Laporan gabungan per guru</button></p><hr><p><button class="b g" onclick="repGA()">Rekap gabungan seluruh guru</button></p></div>`};
function blkJ(id){setJ(JN(id));const n=H(id),c=calc(n),b=listBy(n,0),p=listBy(n,1),li=(a,t)=>a.length?`<p><b>${t}</b></p><ul>${a.map(x=>`<li>${x.t}${x.c?' ('+x.c+')':''}</li>`).join('')}</ul>`:'';
 return{c,html:`<h4>${JL[JN(id)]} - ${DB.sup.find(x=>x.id==id).tanggal}</h4><table><tr><th>Aspek</th><th>Nilai (%)</th></tr>${c.sec.map(x=>`<tr><td>${x.n}</td><td>${f1(x.pct)}</td></tr>`).join('')}<tr><td><b>Nilai</b></td><td><b>${f1(c.pct)} - ${c.cat}</b></td></tr></table><p>Sesuai: ${c.cnt[2]} | Perlu perbaikan: ${c.cnt[1]} | Tidak sesuai: ${c.cnt[0]}</p>${li(p,'Indikator perlu perbaikan')}${li(b,'Indikator tidak sesuai')}`}}
function showRep(ti,h,back){window._rep=h;window._rt=ti;$('#main').innerHTML=`<h2>${ti}</h2><div class="card"><button class="b g" onclick="prt(_rt,_rep)">🖨️ Cetak / Simpan PDF</button><button class="b l" onclick="csv('rt')">Export Excel</button><button class="b l" onclick="go('${back}')">Kembali</button></div><div class="card wrap" style="background:#fff">${h}</div>`}
function repG(ip,ia){const ids=[ip,ia].filter(Boolean);if(!ids.length)return toast('Pilih minimal satu supervisi',1);
 const ss=ids.map(i=>DB.sup.find(x=>x.id==i));if(ss.length>1&&ss[0].guruId!=ss[1].guruId)return toast('Pilih supervisi dari guru yang sama',1);
 const B=ids.map(blkJ),tot=B.reduce((a,x)=>a+x.c.tot,0),mx=B.reduce((a,x)=>a+x.c.mx,0),pct=mx?tot/mx*100:null,s0=ss[0],g=G(s0.guruId),TL=DB.tl.filter(t=>ids.includes(t.sid));
 const h=`<table><tr><td width="25%">Nama guru</td><td>${g.nama}</td><td width="15%">NIP</td><td>${g.nip||s0.nip||'-'}</td></tr><tr><td>Kelas</td><td>${s0.kelas||'-'}</td><td>Semester/TP</td><td>${s0.semester} / ${s0.tahun}</td></tr><tr><td>Supervisor</td><td colspan="3">${s0.supervisor||'-'}</td></tr></table><br>
<table id="rt"><tr><th>Jenis supervisi</th><th>Tanggal</th><th>Nilai (%)</th><th>Kategori</th></tr>${B.map((x,i)=>`<tr><td>${JL[ss[i].jenis||'pembelajaran']}</td><td>${ss[i].tanggal}</td><td>${f1(x.c.pct)}</td><td>${x.c.cat}</td></tr>`).join('')}<tr><td colspan="2"><b>Nilai gabungan</b></td><td><b>${f1(pct)}</b></td><td><b>${catOf(pct)}</b></td></tr></table>
${B.map(x=>x.html).join('<br>')}
${TL.length?`<h4>Rencana tindak lanjut</h4><table><tr><th>Permasalahan</th><th>Rekomendasi</th><th>Batas waktu</th><th>Status</th></tr>${TL.map(t=>`<tr><td>${t.masalah}</td><td>${t.rek}</td><td>${t.deadline||'-'}</td><td>${t.status}</td></tr>`).join('')}</table>`:''}`+ttd(g.nama,s0.sigGuru,g.nip||s0.nip);
 showRep('Laporan Gabungan Supervisi Pembelajaran dan Administrasi Kelas',h,'lapg')}
function repGA(){const last=(g,j)=>DB.sup.filter(s=>s.guruId==g&&JN(s.id)==j).sort((a,b)=>b.tanggal>a.tanggal?1:-1)[0];let k=0;
 const rows=DB.guru.map(g=>{const p=last(g.id,'pembelajaran'),a=last(g.id,'administrasi');if(!p&&!a)return'';const cp=p&&CS(p.id),ca=a&&CS(a.id),tot=(cp?cp.tot:0)+(ca?ca.tot:0),mx=(cp?cp.mx:0)+(ca?ca.mx:0),pc=mx?tot/mx*100:null;k++;
  return `<tr><td>${k}</td><td>${g.nama}</td><td>${g.nip||''}</td><td>${p?f1(cp.pct):'-'}</td><td>${a?f1(ca.pct):'-'}</td><td>${f1(pc)}</td><td>${catOf(pc)}</td></tr>`}).join('');
 showRep('Rekap Gabungan Seluruh Guru',`<p>Data yang dipakai adalah supervisi terbaru tiap jenis. Nilai gabungan = total skor dibagi total skor maksimal indikator yang dinilai.</p><table id="rt"><tr><th>No</th><th>Guru</th><th>NIP</th><th>Pembelajaran</th><th>Administrasi Kelas</th><th>Nilai Gabungan</th><th>Kategori</th></tr>${rows}</table>`+ttd(''),'lapg')}
const KE=e=>e=='Kunci salah'?'Kunci salah (panjang kunci di aplikasi: '+String(CFG.key||'').length+' karakter). Samakan dengan KEY di Code.gs, lalu Deploy versi baru':/fetch|JSON|Unexpected/i.test(e)?e+' (buka aplikasi dari URL /exec, dan pastikan akses deployment = Anyone)':e;
const GS=()=>window.google&&google.script&&google.script.run,ON=()=>!!(CFG.url||GS());
const rpc=(fn,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e&&e.message||e)))[fn](...a));
async function tes(){if(!ON())return toast('Mode demo: belum terhubung ke Google Sheets',1);try{const j=GS()?JSON.parse(await rpc('apiGet',CFG.key)):await (await fetch(CFG.url+'?key='+encodeURIComponent(CFG.key))).json();j.error?toast(KE(j.error),1):toast('Koneksi ke Google Sheets berhasil')}catch(e){toast('Tidak dapat terhubung: '+e.message,1)}}
</script></body></html>
