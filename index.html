const IP=[
['1. Perencanaan Pembelajaran',['Guru memiliki dokumen perencanaan pembelajaran.','Tujuan pembelajaran dirumuskan dengan jelas.','Tujuan pembelajaran sesuai dengan capaian pembelajaran.','Tujuan pembelajaran mempertimbangkan karakteristik dan kebutuhan peserta didik.','Materi pembelajaran sesuai dengan tujuan pembelajaran.','Kegiatan pembelajaran dirancang secara sistematis.','Guru merancang pembelajaran yang berkesadaran (mindful).','Guru merancang pembelajaran yang bermakna (meaningful).','Guru merancang pembelajaran yang menggembirakan (joyful).','Guru merencanakan asesmen awal, proses, dan akhir pembelajaran.','Guru menyiapkan media, sumber, dan lingkungan belajar yang relevan.','Guru merancang pembelajaran yang memperhatikan keberagaman kemampuan peserta didik.']],
['2. Kegiatan Pendahuluan',['Guru membuka pembelajaran dengan salam dan doa.','Guru memeriksa kehadiran peserta didik.','Guru menciptakan suasana kelas yang aman dan nyaman.','Guru membangun kesiapan belajar peserta didik.','Guru melakukan apersepsi.','Guru mengaitkan materi dengan pengalaman nyata peserta didik.','Guru menyampaikan tujuan pembelajaran.','Guru menyampaikan manfaat pembelajaran.','Guru memberikan pertanyaan pemantik.','Guru membangun motivasi dan rasa ingin tahu peserta didik.']],

['5. Asesmen Pembelajaran',['Guru melaksanakan asesmen awal atau diagnostik sesuai kebutuhan.','Guru melaksanakan asesmen formatif.','Guru menggunakan teknik asesmen yang sesuai.','Guru menggunakan instrumen penilaian yang relevan.','Guru memberikan umpan balik yang membangun.','Guru memanfaatkan hasil asesmen untuk memperbaiki pembelajaran.','Guru memberikan pendampingan kepada peserta didik yang membutuhkan.','Guru memberikan pengayaan kepada peserta didik yang telah mencapai tujuan pembelajaran.','Guru melakukan penilaian secara objektif dan berkeadilan.']],

['7. Media dan Sumber Belajar',['Guru menggunakan media pembelajaran yang relevan.','Guru memanfaatkan lingkungan sekitar sebagai sumber belajar.','Guru menggunakan sumber belajar yang sesuai dengan usia peserta didik.','Guru memanfaatkan teknologi apabila tersedia dan relevan.','Media pembelajaran membantu peserta didik memahami materi.','Guru menggunakan sumber belajar yang aman dan dapat dipercaya.']],
['8. Kegiatan Penutup',['Guru membimbing peserta didik menyimpulkan pembelajaran.','Guru melakukan refleksi pembelajaran.','Guru memberikan penguatan terhadap materi.','Guru menyampaikan tindak lanjut pembelajaran.','Guru memberikan informasi kegiatan pembelajaran berikutnya.','Guru menutup pembelajaran dengan baik.']]];
const RP=['Pendampingan penyusunan tujuan pembelajaran dan modul ajar yang selaras dengan capaian pembelajaran, karakteristik peserta didik, serta prinsip berkesadaran, bermakna, dan menggembirakan.','Latihan membuka pembelajaran yang memuat apersepsi, pertanyaan pemantik, serta penyampaian tujuan dan manfaat pembelajaran.','Pembiasaan jeda berpikir, pemusatan perhatian singkat, dan refleksi selama pembelajaran.','Penggunaan masalah nyata dari lingkungan sekitar sebagai konteks, disertai pertanyaan yang mendorong berpikir kritis, eksplorasi, dan karya.','Variasi metode dan media, pemberian apresiasi, serta ruang kreativitas dan partisipasi bagi semua peserta didik.','Penguatan penjelasan konsep utama serta strategi mendorong peserta didik bertanya dan menjelaskan kembali dengan bahasanya sendiri.','Perancangan tugas kontekstual dan proyek sederhana agar peserta didik berlatih, menerapkan, dan menghasilkan karya (diskusi dan pembelajaran kolaboratif).','Penerapan kegiatan refleksi: hal yang sudah dipahami, hal yang masih perlu dipelajari, dan umpan balik guru.','Pendampingan penyusunan instrumen asesmen diagnostik dan formatif serta pemanfaatan hasilnya untuk pendampingan dan pengayaan.','Penerapan disiplin positif, pengelolaan waktu yang efektif, dan perhatian yang adil kepada seluruh peserta didik.','Pemanfaatan media dan lingkungan sekitar sebagai sumber belajar yang sesuai usia dan aman.','Pembiasaan penutup yang memuat kesimpulan bersama, penguatan, refleksi, dan informasi tindak lanjut.'];
const IA=[
['A1. Dokumen Kurikulum dan Perencanaan',['Guru memiliki dokumen Capaian Pembelajaran (CP) sesuai fase dan kelas yang diampu.','Guru memiliki analisis CP yang menghasilkan tujuan pembelajaran.','Guru memiliki Alur Tujuan Pembelajaran (ATP) yang runtut dan sesuai CP.','Guru memiliki Program Tahunan (Prota).','Guru memiliki Program Semester (Promes).','Guru memiliki kalender pendidikan dan jadwal pelajaran.','Perencanaan pembelajaran disusun berdasarkan data kebutuhan peserta didik atau rapor pendidikan.']],
['A2. Modul Ajar',['Modul ajar memuat informasi umum (identitas, kompetensi awal, dimensi profil, sarana prasarana, target peserta didik, model pembelajaran).','Modul ajar memuat komponen inti: tujuan, pemahaman bermakna, pertanyaan pemantik, kegiatan pembelajaran, asesmen, pengayaan dan remedial, serta refleksi.','Modul ajar sesuai dengan CP dan ATP.','Tujuan pembelajaran dalam modul ajar jelas dan dapat diukur.','Kegiatan pembelajaran mencerminkan prinsip berkesadaran, bermakna, dan menggembirakan.','Kegiatan pembelajaran memuat pengalaman memahami, mengaplikasi, dan merefleksi.','Modul ajar memuat diferensiasi sesuai kebutuhan peserta didik.','Lampiran tersedia (LKPD, bahan bacaan, media, glosarium, daftar pustaka).']],
['A3. Asesmen dan Penilaian',['Asesmen diagnostik (kognitif dan nonkognitif) tersedia beserta hasil dan tindak lanjutnya.','Kriteria Ketercapaian Tujuan Pembelajaran (KKTP) tersusun.','Instrumen asesmen formatif dan sumatif tersedia (soal, rubrik, lembar observasi).','Daftar nilai atau rekap penilaian terisi lengkap dan tertib.','Hasil asesmen dianalisis dan dimanfaatkan untuk perbaikan pembelajaran.','Program remedial dan pengayaan terdokumentasi.','Laporan hasil belajar disusun sesuai ketentuan.']],
['A4. Administrasi Kelas dan Peserta Didik',['Daftar hadir peserta didik terisi secara rutin.','Data atau profil peserta didik (identitas, kebutuhan belajar, minat) tersedia.','Jurnal pembelajaran harian terisi.','Catatan perkembangan atau anekdot peserta didik tersedia.','Perangkat kelas tersedia (jadwal piket, tata tertib, denah tempat duduk).','Buku pegangan guru, buku peserta didik, dan sumber belajar tersedia.']],
['A5. Projek Penguatan Profil / Kokurikuler',['Guru memiliki modul atau rencana projek penguatan profil atau kegiatan kokurikuler.','Tema dan tujuan projek sesuai dengan fase dan kebutuhan peserta didik.','Pelaksanaan dan asesmen projek terdokumentasi.']],
['A6. Refleksi dan Pengembangan Kompetensi Guru',['Guru memiliki catatan refleksi pembelajaran.','Guru memiliki bukti pengembangan kompetensi (Platform Merdeka Mengajar, pelatihan, KKG).','Guru memiliki evaluasi diri dan rencana tindak lanjut perbaikan.']],
['A7. Ketertiban dan Kelengkapan Dokumen',['Dokumen tersusun rapi dalam map atau folder digital dan mudah diakses.','Dokumen diperbarui sesuai tahun pelajaran berjalan.','Dokumen disusun secara mandiri dan sesuai format sekolah.','Dokumen tersedia tepat waktu (awal semester).']]];
const RA=['Pendampingan analisis CP, penyusunan ATP, Prota, dan Promes serta pemanfaatan data rapor pendidikan sebagai dasar perencanaan.','Pendampingan penyusunan modul ajar yang memuat komponen inti, diferensiasi, dan prinsip pembelajaran mendalam (berkesadaran, bermakna, menggembirakan).','Pendampingan penyusunan asesmen diagnostik, KKTP, instrumen formatif/sumatif, rubrik, serta program remedial dan pengayaan.','Pembenahan administrasi kelas: daftar hadir, jurnal harian, profil peserta didik, dan catatan perkembangan secara rutin.','Pendampingan penyusunan modul projek penguatan profil/kokurikuler beserta rencana asesmennya.','Pembiasaan penulisan refleksi pembelajaran, dokumentasi pengembangan kompetensi, dan penyusunan rencana tindak lanjut.','Penataan dokumen dalam map atau folder digital yang diperbarui dan dilengkapi tepat waktu setiap semester.'];
let I=IP,R=RP;function use(j){I=j=='adm'?IA:IP;R=j=='adm'?RA:RP}

async function api(a,s,d,id){try{if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(API))throw 'URL Web App belum diisi atau tidak valid (harus berawalan https://script.google.com dan berakhiran /exec)';const r=await fetch(API,{method:'POST',body:JSON.stringify({a,s,d,id,u:U,pw:PW})});let j;try{j=JSON.parse(await r.text())}catch(x){throw 'Server tidak mengembalikan data yang benar. Pastikan Web App di-deploy dengan akses "Anyone" dan versi terbaru'}if(!j.ok)throw j.err;return j}catch(e){toast('Gagal: '+e,1);throw e}}
async function login(){const au=$('api').value.trim();if(au){API=au;try{localStorage.setItem('sisas_api',au)}catch(e){}}PW=$('pw').value;U=$('un').value.trim();const j=await api('login');if(!j.valid)return toast('Nama pengguna/kata sandi salah',1);ROLE=j.role;if(!j.role)alert('Peringatan: backend (Code.gs) masih versi lama. Tempel Code.gs terbaru, jalankan setup(), lalu Deploy > Manage deployments > Edit > New version. Tanpa itu, penyimpanan supervisi tidak akan lengkap.');$('login').hidden=true;$('app').hidden=false;$('side').innerHTML=MENU.map(m=>`<a id="m_${m[0]}" onclick="go('${m[0]}')">${m[1]}</a>`).join('');await load();go('dash')}

return{p:mx?tot/mx*100:null,tot,mx,as:as.map(a=>a.m?a.t/a.m*100:null),c,n:c[2]+c[1]+c[0]}}

/* ===== Pengaturan, Import, Backup, Tanda tangan ===== */
const BK=['Identitas_Sekolah','Data_Guru','Data_Supervisi','Instrumen_Supervisi','Hasil_Penilaian','Catatan_Pertemuan','Tindak_Lanjut','Monitoring'];let UL=[];
const tgt=o=>o=='SET'?SET:CUR;
const sig=(k,o)=>`<canvas data-k="${k}" data-o="${o}" width="240" height="100" style="border:1px dashed #889;touch-action:none;width:240px;max-width:100%"></canvas><br><button class="w" onclick="sigClr('${k}','${o}')">Hapus</button> <input type="file" accept="image/*" onchange="sigUp(this,'${k}','${o}')" style="width:auto">`;
function sigInit(){document.querySelectorAll('canvas[data-k]').forEach(c=>{const k=c.dataset.k,o=c.dataset.o,x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,240,100);x.strokeStyle='#000';x.lineWidth=2;x.lineCap='round';
const v=tgt(o)[k];if(v){const im=new Image();im.onload=()=>x.drawImage(im,0,0,240,100);im.src=v}
let d=0;const xy=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*240/b.width,(e.clientY-b.top)*100/b.height]};
c.onpointerdown=e=>{d=1;x.beginPath();x.moveTo(...xy(e))};c.onpointermove=e=>{if(d){x.lineTo(...xy(e));x.stroke()}};c.onpointerup=c.onpointerleave=()=>{if(d){d=0;tgt(o)[k]=c.toDataURL('image/jpeg',.6)}}})}
function sigClr(k,o){tgt(o)[k]='';sigInit()}
function sigUp(i,k,o){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=240;c.height=100;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,240,100);const s=Math.min(240/im.width,100/im.height);x.drawImage(im,0,0,im.width*s,im.height*s);tgt(o)[k]=c.toDataURL('image/jpeg',.6);sigInit()};im.src=URL.createObjectURL(f)}
setInterval(()=>{try{if(FORM&&CUR&&!CUR.id&&CUR.guruId&&Object.keys(CUR.st||{}).length&&!$('app').hidden)localStorage.setItem('sisas_draft',JSON.stringify({t:Date.now(),c:CUR}))}catch(e){}},15000);
async function impG(f){if(!f)return;if(!window.XLSX)return toast('Pustaka Excel gagal dimuat (perlu internet)',1);const wb=XLSX.read(await f.arrayBuffer()),js=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false}),rows=[];let skip=0;
js.forEach(o=>{const d={};GF.forEach(g=>{const k=Object.keys(o).find(x=>{const y=x.trim().toLowerCase();return y==g[0]||y==g[1].toLowerCase()});d[g[0]]=k?String(o[k]).trim():''});if(!d.nama||!d.nip||S.g.some(x=>x.nip==d.nip)||rows.some(x=>x.nip==d.nip))skip++;else rows.push(d)});
if(rows.length)await api('bulk','Data_Guru',{rows,app:1});await load();vGuru();toast(rows.length+' guru diimpor, '+skip+' dilewati (kosong/duplikat)')}
function vSet(){const a=ROLE=='admin';$('main').innerHTML=`<div class="card"><h3>Identitas Sekolah &amp; Periode</h3><div class="f">${[['nama','Nama Sekolah'],['alamat','Alamat'],['kepsek','Nama Kepala Sekolah'],['nipkepsek','NIP Kepala Sekolah'],['ta','Tahun Pelajaran Default'],['semester','Semester Default (Ganjil/Genap)']].map(f=>`<label>${f[1]}<input value="${esc(SET[f[0]])}" oninput="SET['${f[0]}']=this.value"></label>`).join('')}</div>Tanda tangan kepala sekolah:<br>${sig('ttdK','SET')}<br><button class="g" onclick="saveSet()">Simpan Pengaturan</button></div>
<div class="card"><h3>Data &amp; Cadangan</h3><button onclick="backup()">Backup Data (JSON)</button>${a?`<button class="r" onclick="$('rst').click()">Pulihkan dari Backup</button><input id="rst" type="file" accept=".json" hidden onchange="restore(this.files[0])"><button class="w" onclick="syncIns()">Sinkronkan Instrumen ke Sheet</button>`:''}</div>${a?'<div class="card"><h3>Pengguna &amp; Hak Akses</h3><button class="g" onclick="uForm()">+ Tambah Pengguna</button><div class="tw"><table class="t" id="ut"></table></div><p style="font-size:12px">admin: semua akses | kepsek: kelola data supervisi | pengawas: hanya melihat</p></div>':''}`;sigInit();if(a)lu()}
async function saveSet(){if(!SET.nama)return toast('Nama sekolah wajib diisi',1);SET.id='sekolah';await api('save','Identitas_Sekolah',SET);await load();toast('Pengaturan tersimpan')}
async function lu(){UL=(await api('list','Pengguna')).data;S.u=UL;$('ut').innerHTML='<tr><th>Username</th><th>Nama</th><th>Peran</th><th>Aksi</th></tr>'+UL.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.nama)}</td><td>${esc(u.role)}</td><td><button onclick="uForm('${esc(u.id)}')">Edit</button><button class="r" onclick="uDel('${esc(u.id)}')">Hapus</button></td></tr>`).join('')}
function uForm(id){const u=UL.find(x=>x.id==id)||{};$('dlg').innerHTML=`<h3>Pengguna</h3><label>Username<input id="u_id" value="${esc(u.id)}" ${id?'readonly':''}></label><label>Nama<input id="u_n" value="${esc(u.nama)}"></label><label>Peran<select id="u_r">${['admin','kepsek','pengawas'].map(x=>`<option ${x==u.role?'selected':''}>${x}</option>`).join('')}</select></label><label>Kata sandi ${id?'(kosongkan jika tidak diganti)':'(minimal 6 karakter)'}<input id="u_p" type="password"></label><button class="g" onclick="uSave()">Simpan</button><button class="w" onclick="$('dlg').close()">Batal</button>`;$('dlg').showModal()}
async function uSave(){const e=$('u_id').readOnly,d={id:$('u_id').value.trim(),nama:$('u_n').value,role:$('u_r').value,pw:$('u_p').value};if(!/^[a-z0-9_.-]+$/i.test(d.id))return toast('Username hanya huruf, angka, titik, strip',1);if(!e&&UL.some(x=>String(x.id).toLowerCase()==d.id.toLowerCase()))return toast('Username sudah ada',1);if((!e||d.pw)&&d.pw.length<6)return toast('Kata sandi minimal 6 karakter',1);
await api('save','Pengguna',d);if(d.id==U&&d.pw)PW=d.pw;$('dlg').close();lu();toast('Pengguna tersimpan')}
async function uDel(id){if(id==U)return toast('Tidak dapat menghapus akun yang sedang dipakai',1);if(!confirm('Hapus pengguna '+id+'?'))return;await api('del','Pengguna',null,id);lu();toast('Pengguna dihapus')}
async function backup(){const o={app:'SISAS',tgl:new Date().toISOString(),data:{}};for(const n of BK)o.data[n]=(await api('list',n)).data;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='backup_sisas_'+o.tgl.slice(0,10)+'.json';a.click();toast('Backup diunduh')}
async function restore(f){if(!f||!confirm('Seluruh data saat ini akan DIGANTI dengan isi backup. Lanjutkan?'))return;try{const o=JSON.parse(await f.text());if(o.app!='SISAS')throw 'Berkas bukan backup SISAS';for(const n of BK)if(o.data[n])await api('bulk',n,{rows:o.data[n]});await load();toast('Data berhasil dipulihkan')}catch(e){toast('Gagal memulihkan: '+e,1)}}
async function syncIns(){const rows=[];[['pem',IP],['adm',IA]].forEach(([jn,X])=>X.forEach((g,i)=>g[1].forEach((t,j)=>rows.push({id:jn+'_'+i+'_'+j,jenis:jn,aspek:g[0],no:j+1,indikator:t}))));await api('bulk','Instrumen_Supervisi',{rows});toast('Instrumen disinkronkan ('+rows.length+' indikator)')}

function csv(n,rows){if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Data');XLSX.writeFile(wb,n+'.xlsx');return}const b=new Blob(['\ufeff'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n+'.csv';a.click()}
const rekRows=j=>S.s.filter(s=>(s.jenis||'pem')==j).map(s=>{use(j);const r=calc(s.st);return[s.guru,s.nip,s.kelas,s.mapel,s.tanggal,s.semester,s.ta,f1(r.p),kat(r.p)].concat(r.as.map(f1))});
const rekHead=j=>{use(j);return['Guru','NIP/NUPTK','Kelas','Mapel','Tanggal','Semester','TA','Nilai','Kategori'].concat(I.map(g=>g[0]))};
function rekCsv(j){csv('rekap_supervisi_'+j,[rekHead(j)].concat(rekRows(j)))}
const KS=()=>{const k=S.g.find(g=>/kepala\s*sekolah/i.test(g.jabatan))||{};return{n:SET.kepsek||k.nama||'',p:SET.nipkepsek||k.nip||''}};
const GM=()=>CUR.guru||(S.g.find(x=>x.id==CUR.guruId)||{}).nama||'',GN=()=>CUR.nip||(S.g.find(x=>x.id==CUR.guruId)||{}).nip||'',KN=()=>(!CUR.supervisor||CUR.supervisor==KS().n)?KS().p:'';
function pr(title,body,gr,kp,sg,sk,gn,kn){const w=open('','_blank');w.document.write(`<html><head><title>${title}</title><style>@page{size:A4;margin:18mm}body{font:12pt/1.5 'Times New Roman',serif}.kop{text-align:center;border-bottom:3px double #000;margin-bottom:12px}.kop h2,.kop p{margin:0}table{border-collapse:collapse;width:100%;margin-bottom:8px}td,th{border:1px solid #000;padding:3px 6px;font-size:10.5pt;text-align:left}.ttd{display:flex;justify-content:space-between;align-items:flex-start;margin-top:36px;text-align:center;page-break-inside:avoid}.ttd>div{width:46%}.sg{height:70px;display:flex;align-items:center;justify-content:center}.sg img{max-height:64px;max-width:100%}pre{white-space:pre-wrap;font:inherit}</style></head><body><div class="kop"><h2>${SCH.nama}</h2><p>${SCH.alamat}</p></div><h3 style="text-align:center">${title}</h3>${body}<div class="ttd"><div>Guru yang Disupervisi<div class="sg">${sg?`<img src="${sg}">`:''}</div><b><u>${esc(gr||'..............')}</u></b>${gn?'<br>NIP/NUPTK. '+esc(gn):''}</div><div>Kepala Sekolah/Supervisor<div class="sg">${sk?`<img src="${sk}">`:''}</div><b><u>${esc(kp||'..............')}</u></b>${kn?'<br>NIP. '+esc(kn):''}</div></div></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
const idTbl=()=>`<table>${[['Nama Guru',CUR.guru],['NIP/NUPTK',CUR.nip],['Kelas / Mapel',(CUR.kelas||'')+' / '+(CUR.mapel||'')],['Hari/Tanggal',tgl(CUR.tanggal)],['Semester / TA',(CUR.semester||'')+' / '+(CUR.ta||'')],['Materi',CUR.materi],['Tujuan',CUR.tujuan],['Model/Metode',CUR.model],['Hadir / Tidak Hadir',(CUR.hadir||0)+' / '+(CUR.tidak||0)]].filter(r=>CUR.jenis!='adm'||!['Materi','Tujuan','Model/Metode','Hadir / Tidak Hadir'].includes(r[0])).map(r=>`<tr><td width="30%">${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
const prCat=()=>pr('CATATAN HASIL PERTEMUAN SUPERVISI',idTbl()+'<pre>'+esc(CUR.catatan)+'</pre>',GM(),CUR.supervisor||KS().n,CUR.ttdG,CUR.ttdK,GN(),KN()),prTL=()=>pr('RENCANA TINDAK LANJUT SUPERVISI',idTbl()+'<pre>'+esc(CUR.tl)+'</pre>',GM(),CUR.supervisor||KS().n,CUR.ttdG,CUR.ttdK,GN(),KN());
function prIns(){const L={2:'Sesuai',1:'Perlu Perbaikan',0:'Tidak Sesuai'},r=calc(CUR.st);pr('INSTRUMEN SUPERVISI '+(CUR.jenis=='adm'?'ADMINISTRASI GURU':'PEMBELAJARAN'),idTbl()+I.map((g,i)=>`<b>${g[0]}</b> (nilai ${f1(r.as[i])})<table><tr><th>No</th><th>Indikator</th><th>Status</th><th>Catatan</th></tr>${g[1].map((t,j)=>{const x=CUR.st[i+'_'+j]||{};return`<tr><td>${j+1}</td><td>${t}</td><td>${x.s==null?'Belum dinilai':L[x.s]}</td><td>${esc(x.c)}</td></tr>`}).join('')}</table>`).join('')+`<p><b>Nilai Akhir: ${f1(r.p)} (${kat(r.p)})</b></p>`,GM(),CUR.supervisor||KS().n,CUR.ttdG,CUR.ttdK,GN(),KN())}
